# Admin forms for North Bridge PCs (Pages CMS, https://app.pagescms.org).
# Edits the files in content/ and photos in images/. Saving commits to GitHub,
# which starts the "Publish site" workflow (.github/workflows/publish.yml).
# Listing rules that this form can't express (duplicate IDs, a photo required
# before a PC can go Available, etc.) are enforced by build-tools/content.py
# when publishing; if something is wrong the live site keeps its last good version.

media:
  - name: images
    label: Photos
    input: images
    output: /images
    rename: safe
    extensions: [jpg, jpeg]
  - name: videos
    label: Video clips
    input: videos
    output: /videos
    rename: safe
    extensions: [mp4, mov, m4v]

settings:
  content:
    merge: true          # keep fields this form doesn't show (for example video clips)
  commit:
    templates:
      create: "Add {path} (admin)"
      update: "Update {path} (admin)"
      delete: "Remove {path} (admin)"
      rename: "Rename {oldPath} to {newPath} (admin)"

actions:
  - name: publish
    label: Publish now
    workflow: publish.yml
    ref: current
    confirm:
      title: Publish now?
      message: The website normally updates by itself a minute or two after every save. Use this only if it looks out of date.
      button: Publish

content:
  - name: builds
    label: Gaming PCs
    type: collection
    path: content/builds
    format: json
    filename:
      template: "{id}.json"
      field: false
    operations:
      rename: false
      delete: false      # use Status = Hidden to archive instead
    view:
      fields: [status, price, listedDate]
      primary: title
      sort: [listedDate, title]
      default:
        sort: listedDate
        order: desc
    fields:
      - name: id
        label: Listing ID
        type: string
        required: true
        description: "Month, year and a number, like nov26-01. This becomes the web address of the listing, so never change it after publishing."
        pattern:
          regex: "^[a-z]{3}[0-9]{2}-[0-9]{2}$"
          message: "Use month, year and number, like nov26-01 (lowercase)."
      - name: title
        label: Title
        type: string
        required: true
        description: "Shown on the cards and at the top of the listing. Example: Ryzen 5 3600 / RX 5700 XT"
        options:
          maxlength: 120
      - name: status
        label: Status
        type: select
        required: true
        default: draft
        description: "Only Available and Sold appear on the website."
        options:
          values:
            - { name: draft, label: "Draft (not on the website yet)" }
            - { name: available, label: "Available (live on the website)" }
            - { name: sold, label: "Sold (shown under recently sold)" }
            - { name: hidden, label: "Hidden / archived (not on the website)" }
      - name: price
        label: Price
        type: number
        description: "Whole dollars, no $ sign (650 shows as $650). Required before the listing can be Available or Sold."
        options:
          min: 0
      - name: listedDate
        label: Date listed
        type: date
        options:
          format: "yyyy-MM-dd"
        description: "Newest listings are shown first."
      - name: summary
        label: Short summary
        type: text
        options:
          maxlength: 300
      - name: images
        label: Photos
        type: image
        description: "The first photo is the cover. The order here is the order on the website. Tap Add to pick several photos from your phone at once."
        options:
          media: images
          multiple:
            max: 30
          unique: true
          extensions: [jpg, jpeg]
      - name: videos
        label: Video clips (10 seconds or less)
        type: file
        description: "Short clips only: 10 seconds or less, recorded at 720p if you can. Add them here; after saving, the website makes a small copy with no sound or location data and a cover picture (a minute or two). Phone clips from your camera roll are fine."
        options:
          media: videos
          multiple:
            max: 4
          unique: true
          extensions: [mp4, mov, m4v]
      - name: components
        label: Parts
        type: object
        description: "Fill in what applies. Empty lines are simply not shown."
        fields:
          - { name: cpu, label: Processor (CPU), type: string }
          - { name: gpu, label: Graphics card (GPU), type: string }
          - { name: motherboard, label: Motherboard, type: string }
          - { name: ram, label: Memory (RAM), type: string }
          - { name: storage, label: Storage, type: string }
          - { name: psu, label: Power supply, type: string }
          - { name: case, label: Case, type: string }
          - { name: cooler, label: Cooling, type: string }
          - { name: os, label: Operating system, type: string }
          - { name: networking, label: Wi-Fi / Bluetooth, type: string }
          - name: accessories
            label: Included extras
            type: string
            list: true
      - name: performance
        label: Estimated performance
        type: object
        fields:
          - name: isEstimate
            label: These are estimates, not measured results
            type: boolean
            default: true
          - name: items
            label: Games
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{game}: {fps}"
            fields:
              - { name: game, label: Game, type: string }
              - { name: fps, label: "Frame rate (example: ~100fps)", type: string }
              - { name: settings, label: "Settings (example: 1080p High)", type: string }
      - name: condition
        label: Condition
        type: text
      - name: testingNotes
        label: Testing notes
        type: text
      - name: notes
        label: Anything else buyers should know
        type: text
      - name: eventId
        label: Sale event (optional)
        type: string
        description: "Only if this PC is part of a sale. Must match an event in js/data/events.js. Leave empty otherwise."
      - name: eventPrice
        label: Sale price (optional)
        type: number
        options:
          min: 0

  - name: part-boxes
    label: Part boxes
    type: file
    path: content/part-boxes.json
    format: json
    operations:
      delete: false
    fields:
      - name: boxes
        label: Boxes
        type: object
        description: "Boxes appear on the Part Boxes page in this order. When a box sells out, set Quantity to 0 (it disappears from the page but stays here for next time). Tap Add at the bottom for a new box type."
        list:
          collapsible:
            collapsed: true
            summary: "{brand} {model}: {quantity} in stock"
        fields:
          - { name: brand, label: Brand, type: string }
          - { name: model, label: Model, type: string, required: true }
          - { name: category, label: "Label on the card (example: CPU Box)", type: string }
          - name: quantity
            label: How many you have
            type: number
            required: true
            description: "A whole number. 0 hides the box from the page."
            options:
              min: 0
          - name: price
            label: Price per box
            type: number
            required: true
            description: "Whole dollars, no $ sign (5 shows as $5)."
            options:
              min: 0
          - { name: condition, label: "Condition (example: Good condition. Includes foam inserts.)", type: string }
          - { name: image, label: Photo, type: image }

  - name: sale-banners
    label: Sale banners
    type: file
    path: content/events.json
    format: json
    operations:
      delete: false
    fields:
      - name: events
        label: Sales
        type: object
        description: "A sale puts a banner across the top of every page from its first day to its last day (the last day is included). Only one shows at a time. For a discounted PC, type this sale's code into that listing's Sale event box and its sale price into Sale price. Switch a sale off to end it early."
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: id
            label: Sale code
            type: string
            required: true
            description: "Short code like holiday-2026 (lowercase letters, numbers, dashes). Type the same code into the PC listings that are part of this sale."
            pattern:
              regex: "^[a-z0-9][a-z0-9-]*$"
              message: "Lowercase letters, numbers and dashes only, like holiday-2026."
          - { name: name, label: "Sale name (shown first in the banner, example: Holiday Sale)", type: string, required: true }
          - { name: active, label: Switched on, type: boolean, default: true }
          - name: starts
            label: First day
            type: date
            options:
              format: "yyyy-MM-dd"
          - name: ends
            label: Last day (included)
            type: date
            options:
              format: "yyyy-MM-dd"
          - { name: banner, label: "Banner message (example: Priced to move.)", type: string, required: true }
          - name: showCountdown
            label: Show a "days left" countdown
            type: boolean
            default: false
            description: "Only for a real deadline; a soft, ongoing sale shouldn't pressure anyone."

  - name: faq
    label: FAQ
    type: file
    path: content/faq.json
    format: json
    operations:
      delete: false
    fields:
      - name: items
        label: Questions
        type: object
        description: "Shown in this order on the FAQ page. Questions ticked 'Also show on the home page' make up the home preview (keep it to about 3). The question 'What if something goes wrong after I buy?' is frozen until the legal check: the website will not publish if its wording changes."
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - { name: question, label: Question, type: string, required: true }
          - { name: answer, label: Answer, type: text, required: true }
          - { name: answerExtra, label: "Second paragraph (optional)", type: text }
          - { name: featured, label: Also show on the home page, type: boolean, default: false }
          - { name: id, label: "Internal name (leave empty for a new question)", type: string }

  - name: gallery-extras
    label: Extra gallery photos
    type: file
    path: content/gallery-extras.json
    format: json
    operations:
      delete: false
    fields:
      - name: current
        label: Extra photos for "Available now"
        type: object
        list: true
        fields:
          - { name: src, label: Photo, type: image }
          - { name: alt, label: Short description (for screen readers), type: string }
      - name: completed
        label: Extra photos for "Recently sold"
        type: object
        list: true
        fields:
          - { name: src, label: Photo, type: image }
          - { name: alt, label: Short description (for screen readers), type: string }

  - name: photo-alts
    label: Photo descriptions
    type: file
    path: content/photo-alts.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: src, label: Photo, type: image }
      - { name: alt, label: "Description (for screen readers; example: blue lighting, front view)", type: string }
