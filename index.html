<!DOCTYPE html>
<!--
  REDIRECT STUB for the OLD repo (North-Bridge-PCs). Not part of the site.
  The old repo's Pages site is replaced by copies of this one file, named after every
  page the old site had (index, about, build, builds, contact, custom-build, faq, gallery,
  part-boxes) plus 404.html (which catches every other old address). Visitors with an old
  link land on the same page of the new site (path, ?query and #hash are kept).
  Change NEW_BASE (and the two links below) if the address moves again. Uses no site copy
  beyond the one plain sentence in the body.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacob Skrove PCs has moved</title>
<link rel="canonical" href="https://pcman369.github.io/Jacob-Skrove-PCs/">
<noscript><meta http-equiv="refresh" content="0; url=https://pcman369.github.io/Jacob-Skrove-PCs/"></noscript>
<script>
(function () {
  var NEW_BASE = 'https://pcman369.github.io/Jacob-Skrove-PCs/';
  var OLD_BASE = '/North-Bridge-PCs/';
  var path = location.pathname;
  var rest = path.indexOf(OLD_BASE) === 0 ? path.slice(OLD_BASE.length) : '';
  if (rest === 'index.html') rest = '';
  location.replace(NEW_BASE + rest + location.search + location.hash);
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0c0c0e; color: #f2efe9; font: 18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 1rem; }
  a { color: #ae798e; }
</style>
</head>
<body>
<p>This site has moved to <a href="https://pcman369.github.io/Jacob-Skrove-PCs/">Jacob Skrove PCs</a>.</p>
</body>
</html>
