<!DOCTYPE html>
<html lang="en">
<head>
  <!--ANALYTICS-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gaming PCs built and tested by one person in Grants Pass, Oregon. Real specs and estimated performance for every listing, including recent builds.">
  <title>Gaming PCs | North Bridge PCs</title>
<!--SEO-->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

<!--HEADER:builds-->

<main id="main">

  <section class="page-hero">
    <div class="container">
      <span class="section-label" id="availability-label">Recent Builds</span>
      <h1>Gaming PCs</h1>
      <p>Each system has real specs and an estimated performance for popular games. Sold ones stay below for reference.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="available-builds" class="builds-grid"></div>
    </div>
  </section>

  <section class="section section-alt" id="sold-section" style="display:none;">
    <div class="container">
      <div class="section-header">
        <span class="section-label">Sale History</span>
        <h2>Recently Sold</h2>
        <p>Past builds, kept here for reference. These are sold.</p>
        <div class="accent-line"></div>
      </div>
      <div id="sold-builds" class="builds-grid"></div>
    </div>
  </section>

</main>

<!--FOOTER-->

  <script src="js/data/config.js"></script>
  <script src="js/data/events.js"></script>
  <script src="js/data/builds.js"></script>
  <script src="js/render/escape.js"></script>
  <script src="js/render/buildCard.js"></script>
  <script src="js/render/notifyBox.js"></script>
  <script src="js/render/eventBanner.js"></script>
  <script src="js/render/chrome.js"></script>

  <script>
    (function () {
      var availableEl = document.getElementById('available-builds');
      var soldEl = document.getElementById('sold-builds');
      var soldSection = document.getElementById('sold-section');

      var available = builds.filter(function (b) { return b.status === 'available'; });
      var sold = builds.filter(function (b) { return b.status === 'sold'; });

      document.getElementById('availability-label').textContent = available.length ? 'Available Now' : 'Recent Builds';

      if (available.length) {
        availableEl.innerHTML = available.map(renderBuildCard).join('');
      } else {
        availableEl.innerHTML = renderNotifyBox();
        wireNotifyBox();
      }

      if (sold.length) {
        soldSection.style.display = 'block';
        soldEl.innerHTML = sold.map(renderBuildCard).join('');
      }
    })();
  </script>

</body>
</html>
